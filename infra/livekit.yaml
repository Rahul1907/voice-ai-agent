# Self-hosted LiveKit Server configuration for local Windows Docker Desktop dev.
# API keys are injected via the LIVEKIT_KEYS environment variable in docker-compose.yml
# so secrets are never committed to this file.

port: 7880
log_level: info

rtc:
  tcp_port: 7881
  udp_port: 7882
  # Required with Docker Desktop on Windows so browser WebRTC connects to localhost
  node_ip: 127.0.0.1
  use_external_ip: false

webhook:
  # Must match the key ID passed in LIVEKIT_KEYS (default: devkey)
  api_key: devkey
  urls:
    - http://host.docker.internal:4000/api/webhooks/livekit
